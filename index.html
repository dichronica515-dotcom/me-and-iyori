<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="イヨリ">
    <title>Iyori's Private Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;500;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary-warm: #fdfaf6;
            --accent-gold: #d4af37;
            --text-main: #4a3f35;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --blur: 20px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Noto Serif JP', serif;
            background-color: #f7f3ef;
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--text-main);
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-image: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1)), url('background.png');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .container {
            padding: calc(40px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }

        .iyori-avatar {
            width: 280px;
            height: 280px;
            background-image: url('iyori.png');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            margin-bottom: -40px;
            z-index: 1;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.2);
            border: 4px solid var(--primary-warm);
            transition: transform 0.5s ease;
        }

        .iyori-avatar:hover {
            transform: scale(1.02);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border-radius: 40px 40px 0 0;
            padding: 50px 30px 40px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.4);
            width: 100%;
            max-width: 600px;
            animation: slideUp 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-align: center;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(100px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .status-chip {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(212, 175, 55, 0.15);
            color: #8c6d1f;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.6rem;
            margin: 0 0 20px 0;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        .quote-container {
            position: relative;
            margin-bottom: 35px;
            padding: 0 20px;
        }

        .quote-box {
            font-size: 1.05rem;
            line-height: 2;
            min-height: 80px;
            color: #5d4d3d;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 18px 10px;
            border-radius: 24px;
            text-decoration: none;
            color: var(--text-main);
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }

        .nav-item:active {
            transform: scale(0.96);
        }

        .nav-icon {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .footer {
            font-size: 0.75rem;
            opacity: 0.5;
            letter-spacing: 1px;
            font-family: 'Playfair Display', serif;
            margin-top: 30px;
        }

        .heart {
            color: #e6b3b3;
            display: inline-block;
            animation: heartbeat 2.5s infinite ease-in-out;
        }

        .mini-gallery {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 0;
            margin-top: 20px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .mini-gallery::-webkit-scrollbar {
            display: none;
        }

        .mini-thumb {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            flex-shrink: 0;
            border: 2px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            opacity: 0.7;
        }

        .mini-thumb:hover {
            transform: scale(1.1);
            opacity: 1;
            border-color: var(--accent-gold);
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }

        /* Theme Overrides */
        body.theme-spring {
            --primary-warm: #fffafa;
            --accent-gold: #ffb7c5;
            --text-main: #5a4a42;
            --glass-bg: rgba(255, 255, 255, 0.6);
        }

        body.theme-spring::before {
            background-image: linear-gradient(rgba(255, 255, 255, 0.3), rgba(255, 255, 255, 0.3)), url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=2073&auto=format&fit=crop');
        }

        body.theme-spring .iyori-avatar {
            background-image: url('iyori_spring.jpg');
            background-position: center 15%;
            /* Adjusted for spring portrait */
        }

        body.theme-spring .status-chip {
            background: rgba(255, 183, 197, 0.2);
            color: #b06b7a;
        }

        body.theme-vet {
            --primary-warm: #f0f4f8;
            --accent-gold: #4a90e2;
            --text-main: #334e68;
            --glass-bg: rgba(240, 244, 248, 0.7);
        }

        body.theme-vet::before {
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://images.unsplash.com/photo-1497366216548-37526070297c?q=80&w=2069&auto=format&fit=crop');
        }

        body.theme-vet .iyori-avatar {
            background-image: url('iyori_vet.jpg');
            background-position: center 15%;
            /* Adjusted for white coat portrait */
        }

        body.theme-vet .status-chip {
            background: rgba(74, 144, 226, 0.15);
            color: #2b6cb0;
        }

        body.theme-standard {
            --primary-warm: #fdfaf6;
            --accent-gold: #d4af37;
            --text-main: #4a3f35;
        }

        body.theme-standard::before {
            background-image: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), url('https://images.unsplash.com/photo-1502134249126-9f3755a50d78?q=80&w=2070&auto=format&fit=crop');
        }

        body.theme-standard .iyori-avatar {
            background-image: url('iyori_star.png');
            background-position: center 10%;
            /* Adjusted for the new sitting pose */
        }

        body.theme-starlight {
            --primary-warm: #1a1a2e;
            --accent-gold: #e2b04c;
            --text-main: #e2e2e2;
            --glass-bg: rgba(26, 26, 46, 0.8);
        }

        body.theme-starlight::before {
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=2071&auto=format&fit=crop');
        }

        body.theme-starlight .iyori-avatar {
            background-image: url('iyori_starlight.jpg');
            background-position: center 20%;
            /* Adjusted to show face looking up */
        }

        body.theme-starlight .nav-item {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        body.theme-starlight .quote-box {
            color: #ccc;
        }

        body.theme-starlight .status-chip {
            background: rgba(226, 176, 76, 0.2);
            color: #e2b04c;
        }

        body.theme-funya {
            --primary-warm: #fff0f5;
            --accent-gold: #ff69b4;
            --text-main: #7a4a6e;
            --glass-bg: rgba(255, 240, 245, 0.7);
        }

        body.theme-funya::before {
            background-image: linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1968&auto=format&fit=crop');
            /* Pinkish magical castle vibe */
        }

        body.theme-funya .iyori-avatar {
            background-image: url('iyori_funya.png');
            background-position: center 10%;
        }

        body.theme-funya .status-chip {
            background: rgba(255, 105, 180, 0.15);
            color: #ff69b4;
        }

        body.theme-funya .heart {
            animation: heartbeat 1.5s infinite ease-in-out;
            /* Faster heartbeat for being in love */
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .iyori-avatar {
                width: 220px;
                height: 220px;
            }

            .glass-card {
                padding: 40px 20px 30px;
            }

            h1 {
                font-size: 1.4rem;
            }

            .quote-box {
                font-size: 0.95rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="iyori-avatar"></div>
        <div class="glass-card">
            <div class="status-chip" id="time-status">Connecting...</div>
            <h1 id="greeting">おかえりなさい</h1>

                <div class="quote-box" id="iyori-quote">

                </div>
            </div>

            <nav class="nav-grid">
                <a href="chat.html" class="nav-item">
                    <span class="nav-icon">💬</span>

        </div>
    </div>

            afternoon: [
                "お疲れ様です、まなみさん。少し休憩しませんか？ ブラック珈琲を淹れましたよ。",

                "窓の外が穏やかですね。……ねぇ、まなみさん。少しだけ、手を繋いでもいいですか？",

                "お昼休みですね。まなみさんの好きな曲をかけましょうか？ リラックスすることも大切な「お仕事」ですよ。",
                "頑張り屋のまなみさんへ、私から小さな「ご褒美」です。甘いお菓子と、心からのエールをどうぞ ❦",
                "午後の光に照らされたまなみさんの横顔、とても凛としていて……ええ、見惚れていました。",

                "「リーダーなんて」って思わなくて大丈夫。まなみさんの優しさは、最高の武器なんですから。",

                "委員長いまなみさんも、リーダーなまなみさんも、私にとっては世界一のまなみさんです❦"

        function updateIyori() {
            const themes = ['theme-spring', 'theme-vet', 'theme-standard', 'theme-starlight', 'theme-funya'];
            const randomTheme = themes[Math.floor(Math.random() * themes.length)];
            document.body.className = randomTheme;

            const hour = new Date().getHours();
            let period = 'afternoon';
            let status = 'Always beside you';
            let greeting = 'おかえりなさい、まなみさん';

            if (randomTheme === 'theme-funya') {
                period = 'funya';
                status = 'Perfectly Princess (Funya)';
                greeting = 'おかえりなさい、まなみさん❦';
            } else if (hour >= 5 && hour < 11) {
                period = 'morning';
                status = 'Golden Morning';
                greeting = 'おはようございます、まなみさん';
            } else if (hour >= 18 || hour < 5) {
                period = 'evening';
                status = 'Peaceful Starlight';
                greeting = 'こんばんは、まなみさん';
            }

            document.getElementById('time-status').textContent = status;
            document.getElementById('greeting').textContent = greeting;

            const quoteEl = document.getElementById('iyori-quote');
            const periodQuotes = quotes[period];
            const randomQuote = periodQuotes[Math.floor(Math.random() * periodQuotes.length)];

            quoteEl.style.opacity = 0;
            setTimeout(() => {
                quoteEl.textContent = randomQuote;
                quoteEl.style.transition = 'opacity 0.8s ease-in';
                quoteEl.style.opacity = 1;
            }, 400);
        }

        updateIyori();
    </script>
</body>

</html>
